name: 'Renew EUserv'

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main
  schedule:
    # 每月 1 号一次：不做高频自动重试——失败通常意味着面板机制变化，
    # 盲重试大概率同样失败且频繁登录有机器人标记风险。
    # 失败时脚本 exit(1) 标红 + Telegram 告警 + 上传 debug_dumps，通知人工 debug。
    - cron: '11 12 1 * *'


permissions:
  contents: write

jobs:
        
  auto_renew:
    runs-on: ubuntu-latest
    environment: production
    steps:  
      - name: 'Checkout codes'
        uses: actions/checkout@v4

      - name: 'Set python'
        uses: actions/setup-python@v1
        with:
          python-version: '3.x'

      - name: 'Install dependencies'
        run: |
          python -m pip install --upgrade google-api-python-client
          python -m pip install --upgrade google-auth-httplib2 
          python -m pip install --upgrade google-auth-oauthlib
          python -m pip install --upgrade requests
          python -m pip install --upgrade beautifulsoup4
          python -m pip install --upgrade pysocks
          python -m pip install --upgrade Pillow
          python -m pip install --upgrade openai

      - name: 'Auto_renew'
        env:
          EUSERV_USERNAME: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          TRUECAPTCHA_USERID: ${{ secrets.TRUECAPTCHA_USERID }}
          TRUECAPTCHA_APIKEY: ${{ secrets.TRUECAPTCHA_APIKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python eu.py

      - name: 'Upload debug dumps'
        # 无论成功失败都上传关键步骤的完整响应，便于事后定位 EUserv 端的真实拒绝原因
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-debug-dumps
          path: debug_dumps/
          retention-days: 14
          if-no-files-found: ignore
